<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisador de CSAT</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.5.0/Recharts.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060d1a; --surface: #0d1829; --card: #111f35;
      --border: #1a3050; --border2: #263e5e; --faint: #2a3f5e;
      --text: #dde8f5; --muted: #7091b8;
      --green: #22c55e; --orange: #f59e0b; --red: #ef4444;
      --blue: #60a5fa; --accent: #3b82f6; --accent-dk: #2563eb;
    }
    body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; font-size:14px; line-height:1.6; min-height:100vh; }
    nav { background:var(--surface); border-bottom:1px solid var(--border); padding:0 24px; height:56px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:100; }
    .nav-logo { font-size:15px; font-weight:700; letter-spacing:-0.3px; }
    .nav-badge { font-size:10px; padding:2px 8px; border-radius:12px; background:rgba(59,130,246,.2); color:var(--blue); font-weight:600; margin-left:2px; }
    main { max-width:960px; margin:0 auto; padding:32px 24px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; margin-bottom:16px; }
    .kpi-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 18px; }
    button { font-family:inherit; }
    .btn-primary { background:var(--accent); color:#fff; border:none; padding:13px 24px; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; width:100%; transition:background .15s; }
    .btn-primary:hover { background:var(--accent-dk); }
    .btn-primary:disabled { background:var(--faint); color:var(--muted); cursor:not-allowed; }
    .btn-secondary { background:var(--card); color:var(--muted); border:1px solid var(--border2); padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer; transition:all .15s; }
    .btn-secondary:hover { background:var(--border); color:var(--text); }
    .btn-ai { background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; transition:background .15s; }
    .btn-ai:hover { background:var(--accent-dk); }
    .btn-ai:disabled { background:var(--faint); color:var(--muted); cursor:not-allowed; }
    select { background:var(--surface); color:var(--text); border:1px solid var(--border2); border-radius:8px; padding:9px 12px; font-size:13px; width:100%; outline:none; font-family:inherit; transition:border-color .15s; }
    select:focus { border-color:var(--accent); }
    .upload-zone { border:2px dashed var(--border2); border-radius:12px; padding:52px 32px; text-align:center; cursor:pointer; transition:all .15s; user-select:none; }
    .upload-zone:hover, .upload-zone.drag { border-color:var(--accent); background:rgba(59,130,246,.05); }
    .tab { padding:6px 14px; border-radius:20px; border:1px solid var(--border2); background:var(--card); color:var(--muted); font-size:13px; cursor:pointer; transition:all .15s; font-family:inherit; }
    .tab.active { border-color:var(--accent); background:rgba(59,130,246,.15); color:var(--blue); }
    .slabel { font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
    .grid-kpi { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; }
    .grid-charts { display:grid; gap:16px; }
    .grid-charts.two { grid-template-columns:1fr 1fr; }
    @media(max-width:640px){ .grid-charts.two{grid-template-columns:1fr;} .hero-row{grid-template-columns:1fr !important;} }
    .hero-row { display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:start; margin-bottom:16px; }
    .gauge-wrap { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 16px; display:flex; flex-direction:column; align-items:center; min-width:160px; }
    .feature { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; gap:10px; align-items:flex-start; }
    .ai-box { background:var(--surface); border-radius:8px; padding:20px; font-size:14px; line-height:1.8; }
    .link-btn { background:none; border:none; cursor:pointer; color:var(--blue); font-size:12px; font-family:inherit; padding:0; }
    .link-btn:hover { text-decoration:underline; }
    table { width:100%; border-collapse:collapse; font-size:11px; }
    th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); color:var(--muted); white-space:nowrap; }
    td { padding:6px 10px; color:var(--muted); border-bottom:1px solid rgba(26,48,80,.4); }
    code { font-family:'Courier New',monospace; font-size:12px; background:var(--faint); padding:1px 6px; border-radius:4px; }
  </style>
</head>
<body>
<nav>
  <span style="font-size:18px">📊</span>
  <span class="nav-logo">Analisador de CSAT</span>
  <span class="nav-badge">Powered by Claude AI</span>
</nav>
<main><div id="root"></div></main>

<script>
const { useState, useCallback, useMemo, useRef } = React;
const { BarChart, Bar, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Cell } = Recharts;

// ── Helpers ──────────────────────────────────────────────────────
const KW = {
  csat:  ["csat","nota","score","avaliação","avaliacao","satisfação","satisfacao","rating","nps","feedback"],
  date:  ["data","date","dia","periodo","período","semana","mes","mês","week","month","created"],
  group: ["fila","canal","supervisor","equipe","queue","channel","team","produto","bu","lob","site","representante","rep"],
};
function detectCol(cols, type) {
  return cols.find(c => KW[type].some(k => c.toLowerCase().replace(/[\s_]/g,"").includes(k.replace(/[\s_]/g,"")))) || "";
}
function pn(v) {
  if (v===null||v===undefined||v==="") return NaN;
  return parseFloat(String(v).replace(",","."));
}
function toMonth(v) {
  let d = v instanceof Date ? v : typeof v==="number" ? new Date((v-25569)*86400000) : new Date(String(v));
  if (isNaN(d.getTime())) return String(v).slice(0,7);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function detectScale(data, col) {
  const vals = data.map(r=>pn(r[col])).filter(v=>!isNaN(v));
  if (!vals.length) return "1-5";
  const max = vals.reduce((a,b)=>Math.max(a,b),-Infinity);
  const min = vals.reduce((a,b)=>Math.min(a,b),Infinity);
  if (max<=5) return "1-5";
  if (max<=10) return min<=0?"0-10":"1-10";
  return "0-100";
}
function satFn(sc){ if(sc==="1-5")return v=>v>=4; if(sc.includes("10"))return v=>v>=9; return v=>v>=80; }
function neuFn(sc){ if(sc==="1-5")return v=>v===3; if(sc.includes("10"))return v=>v>=7&&v<9; return v=>v>=60&&v<80; }
function satLabel(sc){ if(sc==="1-5")return"notas 4 e 5"; if(sc.includes("10"))return"notas 9 e 10"; return"nota ≥ 80"; }

function calcMetrics(data, csatCol, scale, dateCol, grpCol) {
  const isSat=satFn(scale), isNeu=neuFn(scale);
  const scores = data.map(r=>pn(r[csatCol])).filter(v=>!isNaN(v));
  if (!scores.length) return null;
  const total=scores.length;
  const satisfied=scores.filter(isSat).length;
  const neutral=scores.filter(isNeu).length;
  const dissatisfied=total-satisfied-neutral;
  const csatPct=(satisfied/total)*100;
  const dist={};
  scores.forEach(v=>{const k=scale==="0-100"?Math.round(v/10)*10:Math.round(v);dist[k]=(dist[k]||0)+1;});
  const distribution=Object.entries(dist).sort(([a],[b])=>+a-+b).map(([score,count])=>({score:String(score),count,pct:+(count/total*100).toFixed(1)}));
  let byGroup=[];
  if (grpCol) {
    const g={};
    data.forEach(r=>{const key=String(r[grpCol]||"Outros").trim();const v=pn(r[csatCol]);if(!isNaN(v)){if(!g[key])g[key]=[];g[key].push(v);}});
    byGroup=Object.entries(g).map(([name,s])=>({name:name.length>26?name.slice(0,26)+"…":name,csat:+(s.filter(isSat).length/s.length*100).toFixed(1),total:s.length})).sort((a,b)=>b.csat-a.csat);
  }
  let trend=[];
  if (dateCol) {
    const t={};
    data.forEach(r=>{const p=toMonth(r[dateCol]);if(!p)return;const v=pn(r[csatCol]);if(!isNaN(v)){if(!t[p])t[p]=[];t[p].push(v);}});
    trend=Object.entries(t).sort(([a],[b])=>a.localeCompare(b)).map(([period,s])=>({period:period.slice(5),fullPeriod:period,csat:+(s.filter(isSat).length/s.length*100).toFixed(1),total:s.length}));
  }
  return {total,csatPct,satisfied,neutral,dissatisfied,distribution,byGroup,trend};
}
function scoreColor(score,scale){const n=+score;if(scale==="1-5")return[null,"#ef4444","#f97316","#f59e0b","#22c55e","#22c55e"][n]||"#60a5fa";if(scale.includes("10"))return n>=9?"#22c55e":n>=7?"#f59e0b":"#ef4444";return n>=80?"#22c55e":n>=60?"#f59e0b":"#ef4444";}
function csatColor(pct){return pct>=80?"#22c55e":pct>=60?"#f59e0b":"#ef4444";}

// ── SVG Gauge ───────────────────────────────────────────────────
function Gauge({pct, color}){
  const R=52,CX=70,CY=70,circ=2*Math.PI*R,track=circ*0.75,fill=track*Math.min(pct/100,1);
  return React.createElement("svg",{width:140,height:140,viewBox:"0 0 140 140","aria-hidden":"true"},
    React.createElement("circle",{cx:CX,cy:CY,r:R,fill:"none",style:{stroke:"#1a3050",strokeWidth:10},strokeDasharray:`${track} ${circ-track}`,strokeLinecap:"round",transform:"rotate(135 70 70)"}),
    React.createElement("circle",{cx:CX,cy:CY,r:R,fill:"none",style:{stroke:color,strokeWidth:10},strokeDasharray:`${fill} ${circ-fill}`,strokeLinecap:"round",transform:"rotate(135 70 70)"}),
    React.createElement("text",{x:CX,y:CY-2,textAnchor:"middle",style:{fill:color,fontSize:22,fontWeight:800,fontFamily:"Inter,sans-serif"}},pct.toFixed(1)+"%"),
    React.createElement("text",{x:CX,y:CY+16,textAnchor:"middle",style:{fill:"#7091b8",fontSize:11,fontFamily:"Inter,sans-serif"}},"CSAT")
  );
}

// ── Components ──────────────────────────────────────────────────
function KPICard({label,value,sub,color}){
  return React.createElement("div",{className:"kpi-card"},
    React.createElement("div",{style:{fontSize:11,color:"#7091b8",marginBottom:6,letterSpacing:0.5}},label),
    React.createElement("div",{style:{fontSize:26,fontWeight:500,lineHeight:1,color:color||"#dde8f5"}},value),
    sub&&React.createElement("div",{style:{fontSize:12,color:"#7091b8",marginTop:4}},sub)
  );
}
function SLabel({children}){return React.createElement("div",{className:"slabel"},children);}
function SelField({label,value,onChange,options,placeholder}){
  return React.createElement("div",null,
    React.createElement("label",{style:{display:"block",fontSize:13,color:"#7091b8",marginBottom:6}},label),
    React.createElement("select",{value,onChange:e=>onChange(e.target.value)},
      React.createElement("option",{value:""},placeholder||"Nenhuma"),
      options.map(o=>React.createElement("option",{key:o,value:o},o))
    )
  );
}
function TipContent({active,payload,label}){
  if(!active||!payload?.length)return null;
  return React.createElement("div",{style:{background:"#0d1829",border:"1px solid #1a3050",borderRadius:8,padding:"10px 14px",fontSize:12}},
    React.createElement("div",{style:{color:"#7091b8",marginBottom:4}},label),
    payload.map((p,i)=>React.createElement("div",{key:i,style:{color:p.color||"#dde8f5"}},p.name+": ",React.createElement("b",null,p.value+(String(p.name||"").toLowerCase().includes("csat")?"%":""))))
  );
}
function MdText({text}){
  return React.createElement("div",{className:"ai-box"},
    text.split("\n").map((line,i)=>{
      if(line.startsWith("## "))return React.createElement("div",{key:i,style:{fontWeight:600,fontSize:14,color:"#dde8f5",marginTop:i===0?0:16,marginBottom:6}},line.slice(3));
      if(line.startsWith("- ")||line.startsWith("• "))return React.createElement("div",{key:i,style:{display:"flex",gap:8,paddingLeft:4,marginBottom:4}},React.createElement("span",{style:{color:"#7091b8",flexShrink:0}},"›"),React.createElement("span",{style:{color:"#7091b8"}},line.slice(2)));
      if(!line.trim())return React.createElement("div",{key:i,style:{height:6}});
      return React.createElement("div",{key:i,style:{color:"#7091b8"}},line);
    })
  );
}

// ── Main App ────────────────────────────────────────────────────
function App(){
  const [step,setStep]=useState("upload");
  const [drag,setDrag]=useState(false);
  const [fileName,setFileName]=useState("");
  const [wb,setWb]=useState(null);
  const [sheets,setSheets]=useState([]);
  const [selSheet,setSelSheet]=useState("");
  const [raw,setRaw]=useState([]);
  const [cols,setCols]=useState([]);
  const [csatCol,setCsatCol]=useState("");
  const [dateCol,setDateCol]=useState("");
  const [grpCol,setGrpCol]=useState("");
  const [aiText,setAiText]=useState("");
  const [aiLoading,setAiLoading]=useState(false);
  const fileRef=useRef();

  const loadSheet=(workbook,name)=>{
    setSelSheet(name);
    const ws=workbook.Sheets[name];
    const data=XLSX.utils.sheet_to_json(ws,{defval:""});
    setRaw(data);
    if(data.length){const c=Object.keys(data[0]);setCols(c);setCsatCol(detectCol(c,"csat"));setDateCol(detectCol(c,"date"));setGrpCol(detectCol(c,"group"));}
    setAiText("");
  };

  const handleFile=useCallback((file)=>{
    if(!file)return;
    setFileName(file.name);
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const workbook=XLSX.read(e.target.result,{type:"array",cellDates:true});
        setWb(workbook);setSheets(workbook.SheetNames);
        loadSheet(workbook,workbook.SheetNames[0]);
        setStep("config");
      }catch(err){alert("Erro ao ler o arquivo. Verifique se é um Excel ou CSV válido.");}
    };
    reader.readAsArrayBuffer(file);
  },[]);

  const scale=useMemo(()=>csatCol&&raw.length?detectScale(raw,csatCol):"1-5",[raw,csatCol]);
  const M=useMemo(()=>raw.length&&csatCol?calcMetrics(raw,csatCol,scale,dateCol||null,grpCol||null):null,[raw,csatCol,scale,dateCol,grpCol]);
  const color=M?csatColor(M.csatPct):"#22c55e";

  const genAI=async()=>{
    if(!M)return;
    setAiLoading(true);setAiText("");
    const topG=M.byGroup.length?`\nMelhores:\n${M.byGroup.slice(0,3).map(g=>`  • ${g.name}: ${g.csat}% (n=${g.total})`).join("\n")}\nPiores:\n${[...M.byGroup].slice(-3).reverse().map(g=>`  • ${g.name}: ${g.csat}% (n=${g.total})`).join("\n")}`:"";
    const trendG=M.trend.length>=2?`\nTendência:\n${M.trend.slice(-5).map(t=>`  • ${t.fullPeriod}: ${t.csat}%`).join("\n")}`:"";
    const prompt=`Você é um analista sênior de CX especialista em CSAT para customer service (Mercado Livre / Mercado Pago).\n\nDADOS:\n- Total: ${M.total} avaliações\n- CSAT: ${M.csatPct.toFixed(1)}%\n- Satisfeitos: ${M.satisfied} (${(M.satisfied/M.total*100).toFixed(1)}%)\n- Neutros: ${M.neutral} (${(M.neutral/M.total*100).toFixed(1)}%)\n- Insatisfeitos: ${M.dissatisfied} (${(M.dissatisfied/M.total*100).toFixed(1)}%)\n- Escala: ${scale} (satisfeito = ${satLabel(scale)})${topG}${trendG}\n\nResponda APENAS neste formato:\n\n## 📊 Resumo Executivo\n[2-3 frases diretas sobre o cenário]\n\n## ⚠️ Pontos de Atenção\n- [ponto 1]\n- [ponto 2]\n- [ponto 3]\n\n## ✅ Recomendações\n- [ação 1]\n- [ação 2]\n- [ação 3]`;
    try{
      // Chama o backend — a chave API fica segura no servidor
      const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({max_tokens:1000,messages:[{role:"user",content:prompt}]})});
      const d=await res.json();
      if(d.error)throw new Error(d.error);
      setAiText(d.content?.filter(c=>c.type==="text").map(c=>c.text).join("")||"Sem resposta.");
    }catch(err){setAiText("❌ "+err.message);}
    setAiLoading(false);
  };

  const e=React.createElement;

  // ── UPLOAD ──
  if(step==="upload")return e("div",{style:{minHeight:"70vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"40px 20px"}},
    e("div",{style:{maxWidth:480,width:"100%"}},
      e("h1",{style:{fontSize:24,fontWeight:800,marginBottom:4,letterSpacing:-0.5}},"Analisador de CSAT"),
      e("p",{style:{color:"#7091b8",margin:"4px 0 32px",fontSize:14}},"Faça upload de uma planilha Excel e receba análise automática com IA."),
      e("div",{
        className:`upload-zone${drag?" drag":""}`,
        onClick:()=>fileRef.current?.click(),
        onDragOver:ev=>{ev.preventDefault();setDrag(true);},
        onDragLeave:()=>setDrag(false),
        onDrop:ev=>{ev.preventDefault();setDrag(false);handleFile(ev.dataTransfer.files[0]);}
      },
        e("div",{style:{fontSize:40,marginBottom:12}},"📁"),
        e("div",{style:{fontWeight:600,fontSize:15,marginBottom:6}},"Arraste a planilha aqui"),
        e("div",{style:{color:"#7091b8",fontSize:13,marginBottom:12}},"ou clique para selecionar"),
        e("div",{style:{color:"#2a3f5e",fontSize:12}},".xlsx · .xls · .csv")
      ),
      e("input",{ref:fileRef,type:"file",accept:".xlsx,.xls,.csv",style:{display:"none"},onChange:ev=>handleFile(ev.target.files[0])}),
      e("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginTop:20}},
        [["✓","Detecção automática de colunas"],["✓","Escala 1-5, 1-10 ou 0-100"],["✓","Análise de tendência mensal"],["✓","Breakdown por fila ou canal"]].map(([ic,lb])=>
          e("div",{key:lb,className:"feature"},
            e("span",{style:{color:"#3b82f6",fontSize:14,marginTop:1}},ic),
            e("span",{style:{color:"#7091b8",fontSize:12,lineHeight:1.4}},lb)
          )
        )
      )
    )
  );

  // ── CONFIG ──
  if(step==="config")return e("div",{style:{padding:"32px 0"}},
    e("h2",{style:{fontSize:18,fontWeight:700,marginBottom:4,display:"flex",alignItems:"center",gap:8}},
      "📄 ",fileName
    ),
    e("p",{style:{color:"#7091b8",margin:"4px 0 28px",fontSize:13}},
      `${raw.length.toLocaleString()} linhas · ${cols.length} colunas  `,
      e("button",{className:"link-btn",onClick:()=>setStep("upload"),style:{marginLeft:8}},"Trocar arquivo")
    ),
    sheets.length>1&&e("div",{className:"card"},
      e(SLabel,null,"Aba"),
      e("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
        sheets.map(s=>e("button",{key:s,className:`tab${s===selSheet?" active":""}`,onClick:()=>loadSheet(wb,s)},s))
      )
    ),
    e("div",{className:"card"},
      e(SLabel,null,"Mapeamento de colunas"),
      e("div",{style:{display:"flex",flexDirection:"column",gap:16}},
        e(SelField,{label:"⭐ Coluna de CSAT / nota (obrigatório)",value:csatCol,onChange:setCsatCol,options:cols,placeholder:"Selecione..."}),
        e(SelField,{label:"📅 Coluna de data — para análise de tendência (opcional)",value:dateCol,onChange:setDateCol,options:cols}),
        e(SelField,{label:"🏷️ Coluna de agrupamento — fila, canal, supervisor (opcional)",value:grpCol,onChange:setGrpCol,options:cols})
      ),
      csatCol&&e("div",{style:{marginTop:20,background:"#060d1a",borderRadius:8,padding:"14px 16px",display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}},
        e("div",null,
          e("div",{style:{fontSize:11,color:"#7091b8",marginBottom:2}},"Escala detectada"),
          e("div",{style:{fontSize:22,fontWeight:700}},scale)
        ),
        e("div",{style:{color:"#7091b8",fontSize:12}},"Satisfeito = "+satLabel(scale))
      )
    ),
    raw.length>0&&e("div",{className:"card",style:{overflowX:"auto"}},
      e(SLabel,null,"Prévia"),
      e("table",null,
        e("thead",null,e("tr",null,cols.slice(0,7).map(c=>e("th",{key:c,style:{color:c===csatCol?"#60a5fa":c===dateCol?"#22c55e":c===grpCol?"#f59e0b":"#7091b8"}},c+(c===csatCol?" ⭐":c===dateCol?" 📅":c===grpCol?" 🏷️":""))))),
        e("tbody",null,raw.slice(0,5).map((row,i)=>e("tr",{key:i},cols.slice(0,7).map(c=>e("td",{key:c},String(row[c] instanceof Date?row[c].toLocaleDateString("pt-BR"):row[c]).slice(0,28))))))
      )
    ),
    e("button",{className:"btn-primary",onClick:()=>csatCol&&setStep("dash"),disabled:!csatCol},"Gerar dashboard →")
  );

  // ── DASHBOARD ──
  if(!M)return e("div",{style:{padding:40,textAlign:"center",color:"#7091b8"}},"Nenhum dado numérico válido na coluna selecionada.");

  return e("div",null,
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24,flexWrap:"wrap",gap:12}},
      e("div",null,
        e("div",{style:{fontSize:11,color:"#7091b8",marginBottom:4,letterSpacing:1,textTransform:"uppercase"}},"Dashboard CSAT"),
        e("div",{style:{fontSize:20,fontWeight:700}},fileName),
        e("div",{style:{fontSize:12,color:"#7091b8",marginTop:4}},`${raw.length.toLocaleString()} registros · coluna `,e("code",null,csatCol),` · escala ${scale}`)
      ),
      e("button",{className:"btn-secondary",onClick:()=>setStep("upload")},"← Nova análise")
    ),

    e("div",{className:"hero-row"},
      e("div",{className:"gauge-wrap"},
        e(Gauge,{pct:M.csatPct,color}),
        e("div",{style:{fontSize:11,color:"#7091b8",marginTop:4}},"Meta ≥ 80%")
      ),
      e("div",{className:"grid-kpi"},
        e(KPICard,{label:"Total",value:M.total.toLocaleString(),sub:"avaliações",color:"#60a5fa"}),
        e(KPICard,{label:"Satisfeitos",value:`${(M.satisfied/M.total*100).toFixed(1)}%`,sub:`${M.satisfied.toLocaleString()} resp.`,color:"#22c55e"}),
        e(KPICard,{label:"Neutros",value:`${(M.neutral/M.total*100).toFixed(1)}%`,sub:`${M.neutral.toLocaleString()} resp.`,color:"#f59e0b"}),
        e(KPICard,{label:"Insatisfeitos",value:`${(M.dissatisfied/M.total*100).toFixed(1)}%`,sub:`${M.dissatisfied.toLocaleString()} resp.`,color:"#ef4444"})
      )
    ),

    e("div",{className:`grid-charts${M.trend.length>1?" two":""}`,style:{marginBottom:16}},
      e("div",{className:"card",style:{padding:20}},
        e(SLabel,null,"Distribuição de notas"),
        e(ResponsiveContainer,{width:"100%",height:200},
          e(BarChart,{data:M.distribution,margin:{top:4,right:4,left:-20,bottom:0}},
            e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#1a3050",vertical:false}),
            e(XAxis,{dataKey:"score",tick:{fill:"#7091b8",fontSize:11},axisLine:false,tickLine:false}),
            e(YAxis,{tick:{fill:"#7091b8",fontSize:10},axisLine:false,tickLine:false}),
            e(Tooltip,{content:e(TipContent)}),
            e(Bar,{dataKey:"count",name:"Respostas",radius:[4,4,0,0]},
              M.distribution.map((d,i)=>e(Cell,{key:i,fill:scoreColor(d.score,scale)}))
            )
          )
        )
      ),
      M.trend.length>1&&e("div",{className:"card",style:{padding:20}},
        e(SLabel,null,"Evolução temporal"),
        e(ResponsiveContainer,{width:"100%",height:200},
          e(LineChart,{data:M.trend,margin:{top:4,right:4,left:-20,bottom:0}},
            e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#1a3050",vertical:false}),
            e(XAxis,{dataKey:"period",tick:{fill:"#7091b8",fontSize:11},axisLine:false,tickLine:false}),
            e(YAxis,{domain:["auto","auto"],tick:{fill:"#7091b8",fontSize:10},axisLine:false,tickLine:false,unit:"%"}),
            e(Tooltip,{content:e(TipContent)}),
            e(Line,{type:"monotone",dataKey:"csat",name:"CSAT",stroke:"#60a5fa",strokeWidth:2.5,dot:{fill:"#60a5fa",r:4,strokeWidth:0}})
          )
        )
      )
    ),

    M.byGroup.length>0&&e("div",{className:"card",style:{padding:20,marginBottom:16}},
      e(SLabel,null,`CSAT por ${grpCol}`),
      e(ResponsiveContainer,{width:"100%",height:Math.max(180,M.byGroup.length*34)},
        e(BarChart,{data:M.byGroup,layout:"vertical",margin:{top:0,right:50,left:10,bottom:0}},
          e(CartesianGrid,{strokeDasharray:"3 3",stroke:"#1a3050",horizontal:false}),
          e(XAxis,{type:"number",domain:[0,100],tick:{fill:"#7091b8",fontSize:10},axisLine:false,tickLine:false,unit:"%"}),
          e(YAxis,{dataKey:"name",type:"category",width:165,tick:{fill:"#dde8f5",fontSize:11},axisLine:false,tickLine:false}),
          e(Tooltip,{content:e(TipContent)}),
          e(Bar,{dataKey:"csat",name:"CSAT",radius:[0,4,4,0]},
            M.byGroup.map((d,i)=>e(Cell,{key:i,fill:d.csat>=80?"#22c55e":d.csat>=60?"#f59e0b":"#ef4444"}))
          )
        )
      )
    ),

    e("div",{className:"card"},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:aiText||aiLoading?20:0}},
        e(SLabel,null,"Análise com IA"),
        e("button",{className:"btn-ai",onClick:genAI,disabled:aiLoading},
          aiLoading?"⏳ Analisando...":"✨ Gerar análise com IA"
        )
      ),
      aiText&&e(MdText,{text:aiText}),
      !aiText&&!aiLoading&&e("p",{style:{color:"#7091b8",fontSize:13,margin:0}},"Gera resumo executivo, pontos de atenção e recomendações baseados nos dados carregados.")
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById("root"));
</script>
</body>
</html>
