<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisador de CSAT</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060d1a;--sur:#0d1829;--card:#111f35;--b1:#1a3050;--b2:#263e5e;--faint:#2a3f5e;--txt:#dde8f5;--mut:#7091b8;--acc:#3b82f6}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
nav{background:var(--sur);border-bottom:1px solid var(--b1);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.badge{font-size:10px;padding:2px 8px;border-radius:12px;background:rgba(59,130,246,.2);color:#60a5fa;font-weight:600}
main{max-width:960px;margin:0 auto;padding:32px 24px}
.card{background:var(--card);border:1px solid var(--b1);border-radius:12px;padding:20px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:16px 18px}
.kpi-label{font-size:11px;color:var(--mut);margin-bottom:6px;letter-spacing:.5px}
.kpi-value{font-size:26px;font-weight:500;line-height:1}
.kpi-sub{font-size:12px;color:var(--mut);margin-top:4px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.hero-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;margin-bottom:16px}
.gauge-wrap{background:var(--card);border:1px solid var(--b1);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;min-width:160px}
.slabel{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
button{font-family:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:none;padding:13px 24px;border-radius:10px;font-size:14px;font-weight:600;width:100%;transition:background .15s}
.btn:hover{background:#2563eb}
.btn:disabled{background:var(--faint);color:var(--mut);cursor:not-allowed}
.btn-sec{background:var(--card);color:var(--mut);border:1px solid var(--b2);padding:8px 16px;border-radius:8px;font-size:13px;transition:all .15s}
.btn-sec:hover{background:var(--b1);color:var(--txt)}
.btn-ai{background:var(--acc);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:background .15s}
.btn-ai:hover{background:#2563eb}
.btn-ai:disabled{background:var(--faint);color:var(--mut);cursor:not-allowed}
select{background:var(--sur);color:var(--txt);border:1px solid var(--b2);border-radius:8px;padding:9px 12px;font-size:13px;width:100%;outline:none;font-family:inherit}
select:focus{border-color:var(--acc)}
.upload-zone{border:2px dashed var(--b2);border-radius:12px;padding:52px 32px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.upload-zone:hover,.upload-zone.drag{border-color:var(--acc);background:rgba(59,130,246,.05)}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--b2);background:var(--card);color:var(--mut);font-size:13px;font-family:inherit}
.tab.active{border-color:var(--acc);background:rgba(59,130,246,.15);color:#60a5fa}
.feature{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.link-btn{background:none;border:none;color:#60a5fa;font-size:12px;font-family:inherit;padding:0;cursor:pointer}
.ai-box{background:var(--sur);border-radius:8px;padding:20px;font-size:14px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 10px;border-bottom:1px solid var(--b1);color:var(--mut);white-space:nowrap}
td{padding:6px 10px;color:var(--mut);border-bottom:1px solid rgba(26,48,80,.4)}
code{font-family:monospace;font-size:12px;background:var(--faint);padding:1px 6px;border-radius:4px}
@media(max-width:640px){.hero-row{grid-template-columns:1fr}.charts-row{grid-template-columns:1fr !important}}
</style>
</head>
<body>
<nav>
  <span style="font-size:18px">📊</span>
  <span style="font-size:15px;font-weight:700">Analisador de CSAT</span>
  <span class="badge">Powered by Claude AI</span>
</nav>
<main id="root">
  <div style="text-align:center;padding:60px 20px;color:var(--mut)">Carregando...</div>
</main>

<script>
// ── Estado global ──────────────────────────────────────────────
var S = {
  screen:'upload', drag:false, fileName:'', wb:null,
  sheets:[], selSheet:'', raw:[], cols:[],
  csatCol:'', dateCol:'', grpCol:'', scale:'1-5',
  metrics:null, aiText:'', aiLoad:false
};

function set(obj){ Object.assign(S,obj); render(); }

// ── Detectores ─────────────────────────────────────────────────
var KW = {
  csat:['csat','nota','score','avaliação','avaliacao','satisfação','satisfacao','rating','nps','feedback'],
  date:['data','date','dia','periodo','período','semana','mes','mês','week','month'],
  group:['fila','canal','supervisor','equipe','queue','channel','team','produto','bu','lob','site','representante']
};
function detectCol(cols,type){
  return cols.find(function(c){return KW[type].some(function(k){return c.toLowerCase().replace(/[\s_]/g,'').indexOf(k.replace(/[\s_]/g,''))>=0;});}) || '';
}
function pn(v){if(v===null||v===undefined||v==='')return NaN;return parseFloat(String(v).replace(',','.'));}
function toMonth(v){
  var d=v instanceof Date?v:typeof v==='number'?new Date((v-25569)*86400000):new Date(String(v));
  if(isNaN(d.getTime()))return String(v).slice(0,7);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function detectScale(data,col){
  var vals=data.map(function(r){return pn(r[col]);}).filter(function(v){return !isNaN(v);});
  if(!vals.length)return '1-5';
  var max=vals.reduce(function(a,b){return Math.max(a,b);},-Infinity);
  var min=vals.reduce(function(a,b){return Math.min(a,b);},Infinity);
  if(max<=5)return '1-5'; if(max<=10)return min<=0?'0-10':'1-10'; return '0-100';
}
function satFn(sc){if(sc==='1-5')return function(v){return v>=4;}; if(sc.indexOf('10')>=0)return function(v){return v>=9;}; return function(v){return v>=80;};}
function neuFn(sc){if(sc==='1-5')return function(v){return v===3;}; if(sc.indexOf('10')>=0)return function(v){return v>=7&&v<9;}; return function(v){return v>=60&&v<80;};}
function satLabel(sc){if(sc==='1-5')return 'notas 4 e 5'; if(sc.indexOf('10')>=0)return 'notas 9 e 10'; return 'nota ≥ 80';}
function csatColor(p){return p>=80?'#22c55e':p>=60?'#f59e0b':'#ef4444';}
function scoreColor(s,sc){var n=+s; if(sc==='1-5')return [null,'#ef4444','#f97316','#f59e0b','#22c55e','#22c55e'][n]||'#60a5fa'; if(sc.indexOf('10')>=0)return n>=9?'#22c55e':n>=7?'#f59e0b':'#ef4444'; return n>=80?'#22c55e':n>=60?'#f59e0b':'#ef4444';}

// ── Cálculo de métricas ────────────────────────────────────────
function calcMetrics(data,cc,scale,dc,gc){
  var isSat=satFn(scale),isNeu=neuFn(scale);
  var scores=data.map(function(r){return pn(r[cc]);}).filter(function(v){return !isNaN(v);});
  if(!scores.length)return null;
  var total=scores.length;
  var satisfied=scores.filter(isSat).length;
  var neutral=scores.filter(isNeu).length;
  var dissatisfied=total-satisfied-neutral;
  var csatPct=satisfied/total*100;
  var dist={};
  scores.forEach(function(v){var k=scale==='0-100'?Math.round(v/10)*10:Math.round(v);dist[k]=(dist[k]||0)+1;});
  var distribution=Object.entries(dist).sort(function(a,b){return +a[0]-+b[0];}).map(function(x){return {score:String(x[0]),count:x[1]};});
  var byGroup=[];
  if(gc){
    var g={};
    data.forEach(function(r){var k=String(r[gc]||'Outros').trim();var v=pn(r[cc]);if(!isNaN(v)){if(!g[k])g[k]=[];g[k].push(v);}});
    byGroup=Object.entries(g).map(function(x){var s=x[1];return {name:x[0].length>28?x[0].slice(0,28)+'…':x[0],csat:+(s.filter(isSat).length/s.length*100).toFixed(1),total:s.length};}).sort(function(a,b){return b.csat-a.csat;});
  }
  var trend=[];
  if(dc){
    var t={};
    data.forEach(function(r){var p=toMonth(r[dc]);if(!p)return;var v=pn(r[cc]);if(!isNaN(v)){if(!t[p])t[p]=[];t[p].push(v);}});
    trend=Object.entries(t).sort(function(a,b){return a[0].localeCompare(b[0]);}).map(function(x){var s=x[1];return {period:x[0].slice(5),fullPeriod:x[0],csat:+(s.filter(isSat).length/s.length*100).toFixed(1)};});
  }
  return {total:total,csatPct:csatPct,satisfied:satisfied,neutral:neutral,dissatisfied:dissatisfied,distribution:distribution,byGroup:byGroup,trend:trend};
}

// ── SVG Charts ─────────────────────────────────────────────────
function gauge(pct,color){
  var R=52,CX=70,CY=70,C=2*Math.PI*R,track=C*0.75,fill=track*Math.min(pct/100,1);
  return '<svg width="140" height="140" viewBox="0 0 140 140">'
    +'<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="#1a3050" stroke-width="10" stroke-dasharray="'+track+' '+(C-track)+'" stroke-linecap="round" transform="rotate(135 70 70)"/>'
    +'<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="10" stroke-dasharray="'+fill.toFixed(1)+' '+(C-fill).toFixed(1)+'" stroke-linecap="round" transform="rotate(135 70 70)"/>'
    +'<text x="'+CX+'" y="'+(CY-2)+'" text-anchor="middle" fill="'+color+'" font-size="22" font-weight="800" font-family="sans-serif">'+pct.toFixed(1)+'%</text>'
    +'<text x="'+CX+'" y="'+(CY+16)+'" text-anchor="middle" fill="#7091b8" font-size="11" font-family="sans-serif">CSAT</text>'
    +'</svg>';
}

function barChart(data,scale){
  if(!data.length)return '';
  var W=460,H=180,pL=30,pR=10,pT=10,pB=30,cW=W-pL-pR,cH=H-pT-pB;
  var maxV=Math.max.apply(null,data.map(function(d){return d.count;}));
  var bW=Math.min(40,(cW/data.length)-4);
  var out='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:180px">';
  for(var i=0;i<=4;i++){var y=pT+cH-(i/4)*cH;out+='<line x1="'+pL+'" y1="'+y.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y.toFixed(1)+'" stroke="#1a3050" stroke-dasharray="3,3"/>';}
  data.forEach(function(d,i){
    var x=pL+(i+0.5)*(cW/data.length)-bW/2;
    var bH=maxV>0?(d.count/maxV)*cH:0;
    var y=pT+cH-bH;
    var c=scoreColor(d.score,scale);
    out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bW+'" height="'+bH.toFixed(1)+'" fill="'+c+'" rx="3"/>';
    out+='<text x="'+(x+bW/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" fill="#7091b8" font-size="10">'+d.score+'</text>';
  });
  out+='</svg>'; return out;
}

function lineChart(data){
  if(data.length<2)return '';
  var W=460,H=180,pL=38,pR=10,pT=15,pB=30,cW=W-pL-pR,cH=H-pT-pB;
  var vals=data.map(function(d){return d.csat;});
  var minV=Math.min.apply(null,vals)-5,maxV=Math.max.apply(null,vals)+5,range=maxV-minV||10;
  function px(i){return pL+(i/(data.length-1))*cW;}
  function py(v){return pT+cH-((v-minV)/range)*cH;}
  var out='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:180px">';
  for(var i=0;i<=4;i++){var v2=minV+(i/4)*range;var y2=py(v2);out+='<line x1="'+pL+'" y1="'+y2.toFixed(1)+'" x2="'+(W-pR)+'" y2="'+y2.toFixed(1)+'" stroke="#1a3050" stroke-dasharray="3,3"/><text x="'+(pL-4)+'" y="'+(y2+4).toFixed(1)+'" text-anchor="end" fill="#7091b8" font-size="9">'+Math.round(v2)+'%</text>';}
  var path='';
  data.forEach(function(d,i){
    var x=px(i).toFixed(1),y=py(d.csat).toFixed(1);
    path+=(i===0?'M':'L')+x+','+y;
    out+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="#60a5fa"/>';
    if(i===0||i===data.length-1||data.length<=8)out+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" fill="#7091b8" font-size="9">'+d.period+'</text>';
  });
  out='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:180px"><path d="'+path+'" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round"/>'+out.slice(out.indexOf('<circle'));
  return out+'</svg>';
}

function hBar(data){
  if(!data.length)return '';
  var W=460,rH=32,pL=175,pR=55,pT=8,cW=W-pL-pR;
  var H=pT+data.length*rH+8;
  var out='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:'+H+'px">';
  data.forEach(function(d,i){
    var y=pT+i*rH,bW=(d.csat/100)*cW;
    var c=d.csat>=80?'#22c55e':d.csat>=60?'#f59e0b':'#ef4444';
    out+='<text x="'+(pL-6)+'" y="'+(y+rH/2+4).toFixed(1)+'" text-anchor="end" fill="#dde8f5" font-size="11">'+d.name+'</text>';
    out+='<rect x="'+pL+'" y="'+(y+6)+'" width="'+bW.toFixed(1)+'" height="'+(rH-12)+'" fill="'+c+'" rx="3"/>';
    out+='<text x="'+(pL+bW+6).toFixed(1)+'" y="'+(y+rH/2+4).toFixed(1)+'" fill="'+c+'" font-size="11" font-weight="600">'+d.csat+'%</text>';
  });
  return out+'</svg>';
}

// ── Helpers HTML ───────────────────────────────────────────────
function kpi(label,value,sub,color){
  return '<div class="kpi"><div class="kpi-label">'+label+'</div><div class="kpi-value" style="color:'+color+'">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';
}
function sel(id,label,value,opts,ph){
  var o=opts.map(function(x){return '<option value="'+x+'"'+(x===value?' selected':'')+'>'+x+'</option>';}).join('');
  return '<div><label style="display:block;font-size:13px;color:#7091b8;margin-bottom:6px">'+label+'</label><select id="'+id+'" onchange="onSel(\''+id+'\',this.value)"><option value="">'+( ph||'Nenhuma')+'</option>'+o+'</select></div>';
}
function mdFmt(txt){
  return txt.split('\n').map(function(l){
    if(l.indexOf('## ')===0)return '<div style="font-weight:600;font-size:14px;color:#dde8f5;margin-top:16px;margin-bottom:6px">'+l.slice(3)+'</div>';
    if(l.indexOf('- ')===0||l.indexOf('• ')===0)return '<div style="display:flex;gap:8px;margin-bottom:4px"><span style="color:#7091b8">›</span><span style="color:#7091b8">'+l.slice(2)+'</span></div>';
    if(!l.trim())return '<div style="height:6px"></div>';
    return '<div style="color:#7091b8">'+l+'</div>';
  }).join('');
}

// ── Eventos ────────────────────────────────────────────────────
function onSel(id,val){
  if(id==='selSheet'){loadSheet(S.wb,val);return;}
  var map={selCsat:'csatCol',selDate:'dateCol',selGrp:'grpCol'};
  if(map[id]){S[map[id]]=val;if(id==='selCsat'&&val)S.scale=detectScale(S.raw,val);render();}
}
function loadSheet(wb,name){
  var ws=wb.Sheets[name];
  var data=XLSX.utils.sheet_to_json(ws,{defval:''});
  S.selSheet=name;S.raw=data;S.aiText='';
  if(data.length){var c=Object.keys(data[0]);S.cols=c;S.csatCol=detectCol(c,'csat');S.dateCol=detectCol(c,'date');S.grpCol=detectCol(c,'group');if(S.csatCol)S.scale=detectScale(data,S.csatCol);}
  render();
}
function handleFile(file){
  if(!file)return;
  S.fileName=file.name;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{var wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});S.wb=wb;S.sheets=wb.SheetNames;loadSheet(wb,wb.SheetNames[0]);S.screen='config';render();}
    catch(e){alert('Erro ao ler arquivo: '+e.message);}
  };
  reader.readAsArrayBuffer(file);
}
function goToDash(){
  if(!S.csatCol)return;
  S.metrics=calcMetrics(S.raw,S.csatCol,S.scale,S.dateCol||null,S.grpCol||null);
  S.screen='dash';render();
}
function genAI(){
  var M=S.metrics;
  if(!M||S.aiLoad)return;
  S.aiLoad=true;S.aiText='';render();
  var topG=M.byGroup.length?'\nMelhores:\n'+M.byGroup.slice(0,3).map(function(g){return '  • '+g.name+': '+g.csat+'% (n='+g.total+')';}).join('\n')+'\nPiores:\n'+M.byGroup.slice(-3).reverse().map(function(g){return '  • '+g.name+': '+g.csat+'% (n='+g.total+')';}).join('\n'):'';
  var tG=M.trend.length>=2?'\nTendência:\n'+M.trend.slice(-5).map(function(t){return '  • '+t.fullPeriod+': '+t.csat+'%';}).join('\n'):'';
  var prompt='Você é analista sênior de CX (Mercado Livre/Mercado Pago).\n\nDADOS:\n- Total: '+M.total+' avaliações\n- CSAT: '+M.csatPct.toFixed(1)+'%\n- Satisfeitos: '+M.satisfied+' ('+(M.satisfied/M.total*100).toFixed(1)+'%)\n- Neutros: '+M.neutral+' ('+(M.neutral/M.total*100).toFixed(1)+'%)\n- Insatisfeitos: '+M.dissatisfied+' ('+(M.dissatisfied/M.total*100).toFixed(1)+'%)\n- Escala: '+S.scale+' (satisfeito = '+satLabel(S.scale)+')'+topG+tG+'\n\nResponda APENAS:\n\n## 📊 Resumo Executivo\n[2-3 frases]\n\n## ⚠️ Pontos de Atenção\n- [ponto 1]\n- [ponto 2]\n- [ponto 3]\n\n## ✅ Recomendações\n- [ação 1]\n- [ação 2]\n- [ação 3]';
  fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_tokens:1000,messages:[{role:'user',content:prompt}]})})
    .then(function(r){return r.json();})
    .then(function(d){if(d.error)throw new Error(d.error);S.aiText=d.content.filter(function(c){return c.type==='text';}).map(function(c){return c.text;}).join('');})
    .catch(function(e){S.aiText='❌ '+e.message;})
    .finally(function(){S.aiLoad=false;render();});
}

// ── Telas ──────────────────────────────────────────────────────
function screenUpload(){
  return '<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">'
    +'<div style="max-width:480px;width:100%">'
    +'<h1 style="font-size:24px;font-weight:800;margin-bottom:4px">Analisador de CSAT</h1>'
    +'<p style="color:#7091b8;margin:4px 0 32px;font-size:14px">Faça upload de uma planilha Excel e receba análise automática com IA.</p>'
    +'<div class="upload-zone'+(S.drag?' drag':'')+'" onclick="document.getElementById(\'fi\').click()" '
    +'ondragover="event.preventDefault();S.drag=true;render()" ondragleave="S.drag=false;render()" '
    +'ondrop="event.preventDefault();S.drag=false;handleFile(event.dataTransfer.files[0])">'
    +'<div style="font-size:40px;margin-bottom:12px">📁</div>'
    +'<div style="font-weight:600;font-size:15px;margin-bottom:6px">Arraste a planilha aqui</div>'
    +'<div style="color:#7091b8;font-size:13px;margin-bottom:12px">ou clique para selecionar</div>'
    +'<div style="color:#2a3f5e;font-size:12px">.xlsx · .xls · .csv</div></div>'
    +'<input type="file" id="fi" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleFile(this.files[0])">'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">'
    +[['✓','Detecção automática de colunas'],['✓','Escala 1-5, 1-10 ou 0-100'],['✓','Análise de tendência mensal'],['✓','Breakdown por fila ou canal']].map(function(x){return '<div class="feature"><span style="color:#3b82f6;font-size:14px">'+x[0]+'</span><span style="color:#7091b8;font-size:12px;line-height:1.4">'+x[1]+'</span></div>';}).join('')
    +'</div></div></div>';
}

function screenConfig(){
  var scaleNote=S.csatCol?'<div style="margin-top:20px;background:#060d1a;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap"><div><div style="font-size:11px;color:#7091b8;margin-bottom:2px">Escala detectada</div><div style="font-size:22px;font-weight:700">'+S.scale+'</div></div><div style="color:#7091b8;font-size:12px">Satisfeito = '+satLabel(S.scale)+'</div></div>':'';
  var shTabs=S.sheets.length>1?'<div class="card"><div class="slabel">Aba</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+S.sheets.map(function(s){return '<button class="tab'+(s===S.selSheet?' active':'')+'" onclick="loadSheet(S.wb,\''+s.replace(/'/g,"\\'")+'\')" >'+s+'</button>';}).join('')+'</div></div>':'';
  var prev=S.raw.length?'<div class="card" style="overflow-x:auto"><div class="slabel">Prévia</div><table><thead><tr>'+S.cols.slice(0,7).map(function(c){return '<th style="color:'+(c===S.csatCol?'#60a5fa':c===S.dateCol?'#22c55e':c===S.grpCol?'#f59e0b':'#7091b8')+'">'+c+(c===S.csatCol?' ⭐':c===S.dateCol?' 📅':c===S.grpCol?' 🏷️':'')+'</th>';}).join('')+'</tr></thead><tbody>'+S.raw.slice(0,5).map(function(row){return '<tr>'+S.cols.slice(0,7).map(function(c){return '<td>'+String(row[c] instanceof Date?row[c].toLocaleDateString('pt-BR'):row[c]).slice(0,28)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>':'';
  return '<div style="padding:32px 0">'
    +'<h2 style="font-size:18px;font-weight:700;margin-bottom:4px">📄 '+S.fileName+'</h2>'
    +'<p style="color:#7091b8;margin:4px 0 28px;font-size:13px">'+S.raw.length.toLocaleString()+' linhas · '+S.cols.length+' colunas <button class="link-btn" onclick="set({screen:\'upload\'})">Trocar arquivo</button></p>'
    +shTabs
    +'<div class="card"><div class="slabel">Mapeamento de colunas</div><div style="display:flex;flex-direction:column;gap:16px">'
    +sel('selCsat','⭐ Coluna de CSAT / nota (obrigatório)',S.csatCol,S.cols,'Selecione...')
    +sel('selDate','📅 Coluna de data — tendência temporal (opcional)',S.dateCol,S.cols)
    +sel('selGrp','🏷️ Coluna de agrupamento — fila, canal, supervisor (opcional)',S.grpCol,S.cols)
    +'</div>'+scaleNote+'</div>'
    +prev
    +'<button class="btn" onclick="goToDash()"'+(S.csatCol?'':' disabled')+'>Gerar dashboard →</button>'
    +'</div>';
}

function screenDash(){
  var M=S.metrics;
  if(!M)return '<div style="padding:40px;text-align:center;color:#7091b8">Nenhum dado válido na coluna selecionada.</div>';
  var col=csatColor(M.csatPct);
  var hasTrend=M.trend.length>1;
  var aiSec=S.aiLoad?'<div style="color:#7091b8;padding:10px 0">⏳ Analisando...</div>':S.aiText?'<div class="ai-box">'+mdFmt(S.aiText)+'</div>':'<p style="color:#7091b8;font-size:13px;margin:0">Gera resumo executivo, pontos de atenção e recomendações com base nos dados.</p>';
  var grpSec=M.byGroup.length?'<div class="card" style="margin-bottom:16px"><div class="slabel">CSAT por '+S.grpCol+'</div>'+hBar(M.byGroup)+'</div>':'';
  return '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap;gap:12px">'
    +'<div><div style="font-size:11px;color:#7091b8;margin-bottom:4px;letter-spacing:1px;text-transform:uppercase">Dashboard CSAT</div>'
    +'<div style="font-size:20px;font-weight:700">'+S.fileName+'</div>'
    +'<div style="font-size:12px;color:#7091b8;margin-top:4px">'+S.raw.length.toLocaleString()+' registros · coluna <code>'+S.csatCol+'</code> · escala '+S.scale+'</div></div>'
    +'<button class="btn-sec" onclick="set({screen:\'upload\'})">← Nova análise</button></div>'
    +'<div class="hero-row"><div class="gauge-wrap">'+gauge(M.csatPct,col)+'<div style="font-size:11px;color:#7091b8;margin-top:4px">Meta ≥ 80%</div></div>'
    +'<div class="grid-kpi">'
    +kpi('Total',M.total.toLocaleString(),'avaliações','#60a5fa')
    +kpi('Satisfeitos',(M.satisfied/M.total*100).toFixed(1)+'%',M.satisfied.toLocaleString()+' resp.','#22c55e')
    +kpi('Neutros',(M.neutral/M.total*100).toFixed(1)+'%',M.neutral.toLocaleString()+' resp.','#f59e0b')
    +kpi('Insatisfeitos',(M.dissatisfied/M.total*100).toFixed(1)+'%',M.dissatisfied.toLocaleString()+' resp.','#ef4444')
    +'</div></div>'
    +'<div class="charts-row" style="display:grid;grid-template-columns:'+(hasTrend?'1fr 1fr':'1fr')+';gap:16px;margin-bottom:16px">'
    +'<div class="card"><div class="slabel">Distribuição de notas</div>'+barChart(M.distribution,S.scale)+'</div>'
    +(hasTrend?'<div class="card"><div class="slabel">Evolução temporal</div>'+lineChart(M.trend)+'</div>':'')
    +'</div>'
    +grpSec
    +'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(S.aiText||S.aiLoad?'20px':'0')+'">'
    +'<div class="slabel">Análise com IA</div>'
    +'<button class="btn-ai" onclick="genAI()"'+(S.aiLoad?' disabled':'')+'>'+( S.aiLoad?'⏳ Analisando...':'✨ Gerar análise com IA')+'</button></div>'+aiSec+'</div>';
}

// ── Render principal ───────────────────────────────────────────
function render(){
  var root=document.getElementById('root');
  if(S.screen==='upload')root.innerHTML=screenUpload();
  else if(S.screen==='config')root.innerHTML=screenConfig();
  else if(S.screen==='dash')root.innerHTML=screenDash();
}

// ── Só inicia quando XLSX carregou ────────────────────────────
function waitXLSX(){
  if(typeof XLSX!=='undefined'){render();}
  else{setTimeout(waitXLSX,100);}
}
waitXLSX();
</script>
</body>
</html>
